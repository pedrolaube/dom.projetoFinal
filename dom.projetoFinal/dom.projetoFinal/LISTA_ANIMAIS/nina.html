<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adote o Toby</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="nina.css">
</head>

<body>

    <div class="wrapper">


        <aside class="pet-card">
            <div class="pet-image-wrapper">
                <img src="img/labrador.jpeg" alt="">
                <span class="status-badge">Pronto para Adoção</span>
            </div>
            <div class="pet-content">
                <h2>Nina</h2>
                <div class="pet-tags">
                    <span>6 anos</span>
                    <span>Porte Médio</span>
                    <span>Vacinado</span>
                    <span>Não castrada</span>
                </div>
                <p>Fêmea · Labrador</p>
                <p>Campinas, SP </p>
                <p> Calma e carinhosa, se dá bem com crianças e outros pets.</p>
            </div>
        </aside>

        <main class="form-container">
            <header class="form-header">
                <h1>Formulário de Adoção</h1>
                <p>Preencha os campos para dar início ao processo de adoção.</p>
            </header>

            <form id="form-adocao">

                <div class="section-title">01. Dados Pessoais</div>

                <div class="field">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                    </div>
                    <div class="field">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15"
                            required>
                    </div>
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                </div>

                <div class="section-title">02. Endereço</div>

                <div class="grid-2">
                    <div class="field">
                        <label for="cep">CEP <span class="loading-cep" id="cep-loading">Buscando...</span></label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
                    </div>

                </div>

                <div class="grid-rua">
                    <div class="field">
                        <label for="rua">Rua </label>
                        <input type="text" id="rua" name="rua" placeholder="Nome da rua" required>
                    </div>
                    <div class="field">
                        <label for="numero">Nº</label>
                        <input type="text" id="numero" name="numero" placeholder="123" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>
                    </div>
                    <div class="field">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" name="estado" placeholder="UF" maxlength="2" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Finalizar Adoção da Nina
                </button>

            </form>
        </main>

    </div>

    <script src="script.js"></script>
</body>

</html>
